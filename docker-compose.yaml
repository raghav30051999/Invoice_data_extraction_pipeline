services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    depends_on:
      - python-worker

  python-worker:
    build: ./python_worker
    ports:
      - "8000:8000"
    volumes:
      - ./files:/files

volumes:
  n8n_data: