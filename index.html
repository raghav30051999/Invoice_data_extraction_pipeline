<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n8n Workflow Explorer | Receipt Extraction Pipeline</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #121212; color: #e0e0e0;
        margin: 0; padding: 40px; line-height: 1.6;
    }
    h1 { color: #ea4b71; border-bottom: 2px solid #333; padding-bottom: 10px; }
    h2 { color: #888; font-weight: normal; margin-top: -10px; margin-bottom: 30px; }
    .container { max-width: 900px; margin: 0 auto; }

    .banner {
        padding: 12px 18px; border-radius: 8px; margin-bottom: 25px;
        font-size: 0.95em; display: none;
    }
    .banner.ok      { display: block; background: #123524; border: 1px solid #2ea043; color: #7ee2a0; }
    .banner.warning { display: block; background: #3d2e00; border: 1px solid #d29922; color: #ffd77a; }

    .node-card {
        background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
        margin-bottom: 15px; overflow: hidden; transition: all 0.2s ease;
    }
    .node-card:hover { border-color: #ea4b71; transform: translateY(-2px); }

    .node-header {
        padding: 15px 20px; cursor: pointer; display: flex;
        justify-content: space-between; align-items: center; background: #252526;
    }
    .node-title { font-weight: bold; font-size: 1.1em; color: #fff; }
    .node-type { font-size: 0.85em; color: #888; background: #333; padding: 4px 8px; border-radius: 4px; }

    .node-content {
        display: none; padding: 20px; background: #181818; border-top: 1px solid #333;
        font-family: 'Courier New', Courier, monospace; font-size: 0.9em;
        white-space: pre-wrap; word-break: break-word; color: #d4d4d4;
        max-height: 400px; overflow-y: auto;
    }

    .toggle-icon { transition: transform 0.2s; color: #888; }
    .active .toggle-icon { transform: rotate(90deg); color: #ea4b71; }
    .loading { text-align: center; padding: 50px; color: #888; font-size: 1.2em; }
</style>
</head>
<body>

<div class="container">
    <h1>📄 Receipt Extraction Pipeline</h1>
    <h2>Interactive n8n Workflow Explorer</h2>
    <p style="color:#aaa; margin-bottom: 30px;">Click on any node below to inspect its configuration, AI prompts, and custom JavaScript code.</p>

    <div id="banner" class="banner"></div>
    <div id="workflow-canvas" class="loading">Loading workflow data…</div>
</div>

<script>
/* ============================================================
   FALLBACK SNAPSHOT — shown only if the live JSON cannot load.
   ============================================================ */
const FALLBACK_NODES = [
    { name: "When clicking 'Test workflow'", type: "n8n-nodes-base.manualTrigger" },
    { name: "Set Configuration", type: "n8n-nodes-base.set" },
    { name: "Read Binary Files", type: "n8n-nodes-base.readWriteFile" },
    { name: "Split In Batches", type: "n8n-nodes-base.splitInBatches" },
    { name: "Extract from File", type: "n8n-nodes-base.extractFromFile" },
    { name: "Extract Text & Detect Corruption", type: "n8n-nodes-base.code" },
    { name: "IF Needs OCR", type: "n8n-nodes-base.if" },
    { name: "HTTP Request - Python OCR Worker", type: "n8n-nodes-base.httpRequest" },
    { name: "Parse OCR Response", type: "n8n-nodes-base.code" },
    { name: "Use Direct Text", type: "n8n-nodes-base.code" },
    { name: "Code in JavaScript", type: "n8n-nodes-base.code" },
    { name: "AI Agent", type: "@n8n/n8n-nodes-langchain.agent" },
    { name: "Structured Output Parser", type: "@n8n/n8n-nodes-langchain.outputParserStructured" },
    { name: "Google Gemini Chat Model", type: "@n8n/n8n-nodes-langchain.lmChatGoogleGemini" },
    { name: "Aggregate Batch Results", type: "n8n-nodes-base.aggregate" },
    { name: "Format for excel", type: "n8n-nodes-base.code" },
    { name: "Read/Write Files from Disk", type: "n8n-nodes-base.readWriteFile" }
].map(n => { n.parameters = { info: "Embedded snapshot. Push workflow/receipt_extraction_workflow.json to see full parameters." }; return n; });

/* Paths the script will try, in order (relative to this page) */
const JSON_PATHS = [
    'workflow/receipt_extraction_workflow.json',
    'workflow/workflow.json',
    'receipt_extraction_workflow.json',
    'workflow.json'
];

function previewOf(node) {
    const p = node.parameters || {};
    if (p.jsCode) return 'JavaScript Code';
    if (p.text) return 'AI Prompt';
    if (p.inputSchema) return 'JSON Schema';
    if (p.url) return p.url;
    return node.type || '';
}

function makeCard(node) {
    const card = document.createElement('div'); card.className = 'node-card';

    const header = document.createElement('div'); header.className = 'node-header';
    const left = document.createElement('div');
    const title = document.createElement('span'); title.className = 'node-title'; title.textContent = node.name;
    const prev = document.createElement('span');
    prev.style.cssText = 'color:#666;margin-left:10px;font-size:.9em;';
    prev.textContent = '(' + previewOf(node) + ')';
    left.appendChild(title); left.appendChild(prev);

    const right = document.createElement('div'); right.style.cssText = 'display:flex;align-items:center;gap:10px;';
    const badge = document.createElement('span'); badge.className = 'node-type';
    badge.textContent = String(node.type || 'node').split('.').pop();
    const icon = document.createElement('span'); icon.className = 'toggle-icon'; icon.textContent = '▶';
    right.appendChild(badge); right.appendChild(icon);

    header.appendChild(left); header.appendChild(right);

    const content = document.createElement('div'); content.className = 'node-content';
    content.textContent = JSON.stringify(node.parameters || {}, null, 2);

    header.addEventListener('click', () => {
        const open = content.style.display === 'block';
        content.style.display = open ? 'none' : 'block';
        card.classList.toggle('active', !open);
    });

    card.appendChild(header); card.appendChild(content);
    return card;
}

function renderCards(nodes) {
    const canvas = document.getElementById('workflow-canvas');
    canvas.className = '';
    canvas.innerHTML = '';
    nodes.forEach(n => canvas.appendChild(makeCard(n)));
}

function showBanner(type, html) {
    const b = document.getElementById('banner');
    b.className = 'banner ' + type;
    b.innerHTML = html;
}

async function loadWorkflow() {
    for (const path of JSON_PATHS) {
        let res;
        try { res = await fetch(path); } catch (e) { continue; }
        if (!res.ok) continue;                       // 404 → try next path
        try {
            const data = await res.json();           // throws if JSON is broken
            if (data && Array.isArray(data.nodes)) return { data, path };
        } catch (e) {
            return { broken: path };                 // file found, but invalid JSON
        }
    }
    return null;
}

(async () => {
    const result = await loadWorkflow();

    if (result && result.data) {
        showBanner('ok', '✅ Live workflow loaded from <b>' + result.path + '</b> — ' + result.data.nodes.length + ' nodes found.');
        renderCards(result.data.nodes);
    }
    else if (result && result.broken) {
        showBanner('warning', '⚠️ File <b>' + result.broken + '</b> was found but contains invalid JSON (usually a trailing comma after manual editing). Validate it at jsonlint.com or re-export from n8n. Showing embedded snapshot below.');
        renderCards(FALLBACK_NODES);
    }
    else {
        showBanner('warning', '⚠️ Workflow JSON not found in the repository. Run: <b>git add workflow/ && git commit -m "add workflow" && git push</b>. Showing embedded snapshot below.');
        renderCards(FALLBACK_NODES);
    }
})();
</script>

</body>
</html>
